<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="global.css">
    <!-- JAVASCRIPT -->
    <script src="main.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM has been loaded!');
            const form = document.getElementById('suggestForm');

            form.addEventListener('submit', () => {
                alert('Your form has been submitted! We will review your suggestion and decide whether it will be a bill we will create!');
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', async (event) => {
            const nav = document.querySelector('.nav');
            const section = document.getElementById('sectionForm');

            section.classList.remove('pre-animation');
            section.classList.add('fade-in');
            await wait(250);
            nav.classList.remove('pre-animation');
            nav.classList.add('fade-in');
        });
    </script>
</head>
<body>
    <header>
    <img src="logo.webp" width="100px"><hgroup>
        <h1><i>MANA MOVEMENT</i></h1>
        <p><i>WE MOVE WITH MANA</i></p>
    </hgroup>
    <button>TESTING</button>
    <hr>
    </header>
    <main>
        <section clas="pre-animation" id="sectionForm">
            <h2>Suggest some policies you want at St. Pat's and we will review!</h2>
            <form action="suggestions2.html" id="suggestForm">
                <input type="text" placeholder="First Name" required><br>
                <input type="text" placeholder="Middle Name (optional)"><br>
                <input type="text" placeholder="Last Name" required><br>
                <input type="email" placeholder="Email" required><br>
                <input type="text" placeholder="Electorate" required><br>
                <input type="text" placeholder="Electorate's MP" required><br>
                <button type="submit">Continue</button>
            </form>
        </section>
    </main>
    <nav class="nav pre-animation">
        <h2>Navigation</h2><br>
        <button onclick="window.location.href='index.html'">Back</button><br>
    </nav>
    <footer>
        <p><i>&copy; Mana Movement 2026</i></p>
    </footer>
</body>
</html>
