<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit your idea!</title>
    <link rel="stylesheet" href="global.css">
    <!-- JAVASCRIPT -->
    <script src="main.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async (event) => {
            console.log()
            const nav = document.querySelector('.nav');
            const section = document.getElementById('sectionForm2');

            section.classList.remove('pre-animation');
            section.classList.add('fade-in');
            await wait(250);
            nav.classList.remove('pre-animation');
            nav.classList.add('fade-in');
        });
    </script>
</head>
<body>
    <header>
    <img src="logo.webp" width="100px"><hgroup>
        <h1><i>MANA MOVEMENT</i></h1>
        <p><i>LETS MAKE ST PATS GREAT AGAIN</i></p>
    </hgroup>
    <hr>
    </header>
    <main>
        <section class="pre-animation" id="sectionForm2">
            <h2>Suggest some policies you want at St. Pat's and we will review!</h2>
            <form action="submit.html" id="suggestForm">
                <div class="formSection">
                    <input type="text" placeholder="Suggestion" required><br>
                </div>
                <div class="submit-container">
                <button type="submit">Submit</button>
                </div>
            </form>
        </section>
    </main>
    <nav class="nav pre-animation">
        <h2>Navigation</h2><br>
        <button onclick="window.location.href='index.html'">Back</button><br>
    </nav>
    <footer>
        <p><i>&copy; Mana Movement 2026</i></p>
    </footer>
</body>
</html>
