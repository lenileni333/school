<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for submitting your request</title>
    <link rel="stylesheet" href="global.css">
    <script src="main.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async (event) => {
            console.log('DOM loaded');
            const section = document.getElementById('submitSect').classList;
            const nav = document.querySelector('.nav').classList;

            section.remove('pre-animation');
            section.add('fade-in');
            await wait(250);
            nav.remove('pre-animation');
            nav.add('fade-in');
        });
    </script>
</head>
<body>
        <header>
        <img src="logo.webp" width="100px"><hgroup>
            <h1><i>MANA MOVEMENT</i></h1>
            <p><i>LETS MAKE ST PATS GREAT AGAIN</i></p>
        </hgroup>
        <hr>
    </header>
    <main>
        <section id="submitSect" class="pre-animation">
            <h2>Thank You!</h2>
            <p>You have submitted your form, you may now head back to the homepage.</p>
        </section>
    </main>
    <nav class="nav pre-animation">
        <h2>Navigation</h2><br>
        <button onclick="window.location.href='index.html'">Return</button>
    </nav>
    <footer>
        <p><i>&copy; Mana Movement 2026</i></p>
    </footer>
</body>
</html>
